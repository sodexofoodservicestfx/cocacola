<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coca-Cola</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #F40009;
    color: white;
}

/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.10) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08) 0 3px, transparent 4px),
        #F40009;
}

/* Decorative circles */

.bubble {
    position: absolute;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.12);
}

.bubble.one {
    width: 180px;
    height: 180px;
    top: -60px;
    left: -50px;
}

.bubble.two {
    width: 280px;
    height: 280px;
    right: -120px;
    bottom: -100px;
}

.bubble.three {
    width: 90px;
    height: 90px;
    right: 18%;
    top: 12%;
}

/* Main content */

.welcomeContent {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 1000px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Coca-Cola logo */

.cocaLogo {
    width: min(750px, 80vw);
    height: auto;

    display: block;

    margin-bottom: 30px;
}

/* Divider */

.logoLine {
    width: 240px;
    height: 5px;

    background: white;

    border-radius: 10px;

    margin-bottom: 35px;
}

/* Welcome text */

.welcomeText {
    font-size: clamp(28px, 4vw, 55px);
    font-weight: bold;

    letter-spacing: 4px;

    margin-bottom: 45px;
}

/* Start button */

#startButton {
    width: min(520px, 80vw);
    height: 120px;

    border: 5px solid white;
    border-radius: 30px;

    background: white;
    color: #F40009;

    font-size: clamp(32px, 4vw, 52px);
    font-weight: 900;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 10px 0 rgba(0,0,0,0.15);

    transition:
        transform 0.1s,
        box-shadow 0.1s;
}

#startButton:active {
    transform: translateY(8px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}

/* Small bottom text */

.bottomText {
    margin-top: 40px;

    font-size: 22px;
    font-weight: bold;

    opacity: 0.9;

    letter-spacing: 2px;
}

/* =========================
   MAIN MENU
========================= */

#mainMenu {
    width: 100%;
    height: 100%;

    display: none;

    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background: #F40009;
}

.menuContent {
    width: 90%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

.menuLogo {
    width: min(430px, 55vw);
    height: auto;

    margin-bottom: 15px;

     transform: translateY(-100px);
}

.menuTitle {
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 900;

    letter-spacing: 3px;

    margin-bottom: 30px;
}

.menuButtons {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 20px;
}

.menuButton {
    min-height: 150px;

    border: 5px solid white;
    border-radius: 25px;

    background: white;
    color: #F40009;

    font-size: clamp(25px, 3vw, 40px);
    font-weight: 900;

    cursor: pointer;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 12px;

    box-shadow:
        0 8px 0 rgba(0,0,0,0.15);

    transition:
        transform 0.1s,
        box-shadow 0.1s;
}

.menuButton:active {
    transform: translateY(7px);

    box-shadow:
        0 2px 0 rgba(0,0,0,0.15);
}

.menuButton span {
    display: block;
}


/* =========================
   T972 / SMALLER SCREENS
========================= */

@media (max-width: 800px) {

    .menuButtons {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .menuButton {
        min-height: 110px;
    }

}

/* =========================
   COKE TRIVIA
========================= */

#triviaScreen,
#triviaResults {
    width: 100%;
    height: 100%;

    display: none;

    align-items: center;
    justify-content: center;

    background: #F40009;

    color: white;

    overflow: hidden;
}

.triviaContent {
    width: 92%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.triviaLogo {
    width: min(300px, 35vw);
    height: auto;

    margin-bottom: 20px;
}

.triviaTop {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.backButton {
    border: 3px solid white;
    border-radius: 15px;

    background: transparent;
    color: white;

    padding: 15px 25px;

    font-size: 22px;
    font-weight: bold;
}

#triviaQuestionNumber,
#triviaScore {
    font-size: 24px;
    font-weight: 900;
}

.triviaQuestion {
    width: 100%;

    min-height: 160px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: white;
    color: #F40009;

    border-radius: 25px;

    padding: 30px;

    font-size: clamp(30px, 4vw, 50px);
    font-weight: 900;

    margin-bottom: 25px;
}

.triviaAnswers {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.triviaAnswer {
    min-height: 100px;

    border: 4px solid white;
    border-radius: 20px;

    background: white;
    color: #F40009;

    font-size: clamp(24px, 3vw, 36px);
    font-weight: 900;

    padding: 20px;

    cursor: pointer;

    box-shadow: 0 7px 0 rgba(0,0,0,0.15);
}

.triviaAnswer:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}

.triviaAnswer.correct {
    background: #2e9b4b;
    color: white;
}

.triviaAnswer.wrong {
    background: #222;
    color: white;
}

#triviaFeedback {
    min-height: 50px;

    margin-top: 15px;

    font-size: 28px;
    font-weight: 900;

    text-align: center;
}


/* =========================
   TRIVIA RESULTS
========================= */

.resultsContent {
    width: 90%;
    max-width: 950px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow-y: auto;

    max-height: 95vh;
}

.resultsLogo {
    width: min(280px, 30vw);

    margin-bottom: 10px;
}

.resultsContent h1 {
    font-size: clamp(30px, 4vw, 50px);

    margin-bottom: 10px;
}

#finalScore {
    font-size: clamp(45px, 6vw, 75px);

    font-weight: 900;

    margin-bottom: 25px;
}

#wrongAnswers {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 15px;

    margin-bottom: 25px;
}

.wrongAnswerCard {
    background: white;
    color: #222;

    border-radius: 18px;

    padding: 20px;

    text-align: left;

    font-size: 22px;
}

.wrongAnswerCard strong {
    color: #F40009;
}

.resultButtons {
    display: flex;

    gap: 20px;

    flex-wrap: wrap;

    justify-content: center;
}

.resultButtons button {
    min-width: 260px;
    min-height: 80px;

    border: 4px solid white;
    border-radius: 20px;

    background: white;
    color: #F40009;

    font-size: 25px;
    font-weight: 900;

    padding: 15px 25px;
}


/* =========================
   SMALLER SCREENS
========================= */

@media (max-width: 800px) {

    .triviaAnswers {
        grid-template-columns: 1fr;
    }

    .triviaAnswer {
        min-height: 80px;
    }

    .triviaQuestion {
        min-height: 130px;
    }

}

    /* =========================
   COKE OR NOT?
========================= */

#cokeOrNotScreen,
#cokeOrNotResults {
    width: 100%;
    height: 100%;

    display: none;

    align-items: center;
    justify-content: center;

    background: #F40009;
    color: white;

    overflow: hidden;
}

.cokeOrNotContent {
    width: 92%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

.cokeOrNotLogo {
    width: min(260px, 30vw);
    height: auto;

    margin-bottom: 15px;
}

.cokeOrNotTop {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

#cokeOrNotQuestionNumber,
#cokeOrNotScore {
    font-size: 24px;
    font-weight: 900;
}

.cokeOrNotTitle {
    font-size: clamp(30px, 4vw, 50px);
    font-weight: 900;

    margin-bottom: 15px;
}

.cokeProductImage {
    width: min(420px, 45vw);
    height: 350px;

    object-fit: contain;

    background: white;

    border-radius: 25px;

    padding: 20px;

    margin-bottom: 20px;
}

.cokeOrNotButtons {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;
}

.cokeChoiceButton {
    min-height: 110px;

    border: 5px solid white;
    border-radius: 25px;

    background: white;
    color: #F40009;

    font-size: clamp(30px, 4vw, 48px);
    font-weight: 900;

    cursor: pointer;

    box-shadow: 0 8px 0 rgba(0,0,0,0.15);
}

.cokeChoiceButton:active {
    transform: translateY(6px);

    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}

.cokeChoiceButton.correct {
    background: #2e9b4b;
    color: white;
}

.cokeChoiceButton.wrong {
    background: #222;
    color: white;
}

#cokeOrNotFeedback {
    min-height: 40px;

    margin-top: 10px;

    font-size: 26px;
    font-weight: 900;
}


/* =========================
   COKE OR NOT RESULTS
========================= */

.cokeOrNotResultsContent {
    width: 94%;
    max-width: 1100px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;

    max-height: 100vh;
}

#cokeOrNotFinalScore {
    font-size: clamp(45px, 6vw, 75px);

    font-weight: 900;

    margin-bottom: 20px;
}

#cokeOrNotWrongAnswers {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 15px;
}

.cokeOrNotWrongCard {
    background: white;
    color: #222;

    border-radius: 15px;

    padding: 12px 16px;

    text-align: left;

    font-size: 18px;
    line-height: 1.25;
}

.cokeOrNotWrongCard strong {
    color: #F40009;
}

.cokeOrNotResultButtons {
    display: flex;

    gap: 15px;

    justify-content: center;

    flex-wrap: wrap;
}

.cokeOrNotResultButtons button {
    min-width: 240px;
    min-height: 70px;

    border: 4px solid white;
    border-radius: 20px;

    background: white;
    color: #F40009;

    font-size: 24px;
    font-weight: 900;

    padding: 12px 20px;
}


/* =========================
   SMALLER SCREENS
========================= */

@media (max-width: 800px) {

    .cokeOrNotButtons {
        grid-template-columns: 1fr;
    }

    .cokeProductImage {
        height: 260px;
    }

    #cokeOrNotWrongAnswers {
        grid-template-columns: 1fr 1fr;
    }

}
    
</style>
</head>

<body>

<!-- =========================
     WELCOME SCREEN
========================= -->

<div id="welcomeScreen">

    <div class="bubble one"></div>
    <div class="bubble two"></div>
    <div class="bubble three"></div>

    <div class="welcomeContent">

        <img
    src="Coca-Cola_logo_white.png"
    alt="Coca-Cola"
    class="cocaLogo">

        <div class="logoLine"></div>

        <div class="welcomeText">
            WELCOME
        </div>

        <button id="startButton">
            START
        </button>

      

    </div>

</div>


<!-- =========================
     MAIN MENU
========================= -->

<div id="mainMenu">

    <div class="menuContent">

        <img
            src="Coca-Cola_logo_white.png"
            alt="Coca-Cola"
            class="menuLogo">

        

        <div class="menuButtons">

            <button class="menuButton" id="triviaButton">
                🧠
                <span>COKE TRIVIA</span>
            </button>

            <button class="menuButton" id="cokeOrNotButton">
                👀
                <span>COKE OR NOT?</span>
            </button>

            <button class="menuButton" id="guessProductButton">
                🕵️
                <span>GUESS THE COKE PRODUCT</span>
            </button>

            <button class="menuButton" id="worldButton">
                🌎
                <span>COKE AROUND THE WORLD</span>
            </button>

        </div>
        

    </div>

</div>


<!-- =========================
     COKE TRIVIA
========================= -->

<div id="triviaScreen">

    <div class="triviaContent">

        <img
            src="Coca-Cola_logo_white.png"
            alt="Coca-Cola"
            class="triviaLogo">

        <div class="triviaTop">

            <button id="triviaBackButton" class="backButton">
                ← MENU
            </button>

            <div id="triviaQuestionNumber">
                QUESTION 1 OF 5
            </div>

            <div id="triviaScore">
                SCORE: 0
            </div>

        </div>

        <div class="triviaQuestion" id="triviaQuestion">
            Question goes here
        </div>

        <div class="triviaAnswers" id="triviaAnswers">
        </div>

        <div id="triviaFeedback"></div>

    </div>

</div>


<!-- =========================
     TRIVIA RESULTS
========================= -->

<div id="triviaResults">

    <div class="resultsContent">

        <img
            src="Coca-Cola_logo_white.png"
            alt="Coca-Cola"
            class="resultsLogo">

        <h1>TRIVIA COMPLETE!</h1>

        <div id="finalScore"></div>

        <div id="wrongAnswers"></div>

        <div class="resultButtons">

            <button id="playTriviaAgain">
                PLAY AGAIN
            </button>

            <button id="resultsMenuButton">
                BACK TO MENU
            </button>

        </div>

    </div>

</div>
<script>

/* =========================
   SCREEN NAVIGATION
========================= */

const welcomeScreen = document.getElementById("welcomeScreen");
const mainMenu = document.getElementById("mainMenu");
const triviaScreen = document.getElementById("triviaScreen");
const triviaResults = document.getElementById("triviaResults");


/* =========================
   START BUTTON
========================= */

document.getElementById("startButton").addEventListener("click", function() {

    welcomeScreen.style.display = "none";
    mainMenu.style.display = "flex";

});


/* =========================
   COKE TRIVIA QUESTIONS
========================= */

const cokeTriviaQuestions = [

    {
        question: "Which holiday character became strongly associated with Coca-Cola advertising?",
        answers: [
            "Santa Claus",
            "The Easter Bunny",
            "The Grinch",
            "Frosty the Snowman"
        ],
        correct: "Santa Claus"
    },

    {
        question: "What kind of vehicle is famous in Coca-Cola holiday ads?",
        answers: [
            "A red delivery truck",
            "A yellow school bus",
            "A blue sports car",
            "A green train"
        ],
        correct: "A red delivery truck"
    },

    {
        question: "What material were many early Coca-Cola bottles made from?",
        answers: [
            "Glass",
            "Plastic",
            "Aluminum",
            "Paper"
        ],
        correct: "Glass"
    },

    {
        question: "What year was Coca-Cola invented?",
        answers: [
            "1886",
            "1896",
            "1906",
            "1916"
        ],
        correct: "1886"
    },

    {
        question: "Who invented Coca-Cola?",
        answers: [
            "Dr. John Pemberton",
            "Asa Candler",
            "Frank Robinson",
            "Raymond Loewy"
        ],
        correct: "Dr. John Pemberton"
    },

    {
        question: "What city was Coca-Cola created in?",
        answers: [
            "Atlanta, Georgia",
            "New York, New York",
            "Chicago, Illinois",
            "Boston, Massachusetts"
        ],
        correct: "Atlanta, Georgia"
    },

    {
        question: "What was Coca-Cola originally sold at?",
        answers: [
            "A pharmacy",
            "A grocery store",
            "A movie theatre",
            "A restaurant"
        ],
        correct: "A pharmacy"
    },

    {
        question: "What colour is the classic Coca-Cola bottle commonly associated with?",
        answers: [
            "Green",
            "Blue",
            "red",
            "brown"
        ],
        correct: "Green"
    },

    {
        question: "What is Coca-Cola commonly shortened to?",
        answers: [
            "Coke",
            "Cola",
            "CC",
            "C-Cola"
        ],
        correct: "Coke"
    },

    {
        question: "What does the word “Cola” in Coca-Cola refer to?",
        answers: [
            "Kola nuts",
            "Cocoa beans",
            "Coffee beans",
            "Cola flowers"
        ],
        correct: "Kola nuts"
    },

    {
        question: "What does the word “Coca” in Coca-Cola refer to?",
        answers: [
            "The coca leaf",
            "Cocoa beans",
            "A type of sugar",
            "A type of citrus fruit"
        ],
        correct: "The coca leaf"
    },

    {
        question: "What was Coca-Cola originally intended to be?",
        answers: [
            "A medicinal tonic",
            "An energy drink",
            "A sports drink",
            "A fruit juice"
        ],
        correct: "A medicinal tonic"
    },

    {
        question: "What was Coca-Cola's first recorded serving price?",
        answers: [
            "5 cents",
            "10 cents",
            "15 cents",
            "25 cents"
        ],
        correct: "5 cents"
    },

    {
        question: "What year did Coca-Cola first begin being bottled?",
        answers: [
            "1899",
            "1886",
            "1909",
            "1915"
        ],
        correct: "1899"
    },

    {
        question: "What inspired the shape of the Coca-Cola contour bottle?",
        answers: [
            "The cocoa pod",
            "The coca leaf",
            "The kola nut",
            "A football"
        ],
        correct: "The cocoa pod"
    }

];

/* =========================
   GAME VARIABLES
========================= */

let triviaQuestions = [];
let currentTriviaQuestion = 0;
let triviaScore = 0;
let wrongTriviaAnswers = [];


/* =========================
   SHUFFLE
========================= */

function shuffleArray(array) {

    return array.sort(() => Math.random() - 0.5);

}


/* =========================
   START TRIVIA
========================= */

document.getElementById("triviaButton").addEventListener("click", startTrivia);


function startTrivia() {

    mainMenu.style.display = "none";
    triviaResults.style.display = "none";
    triviaScreen.style.display = "flex";

    currentTriviaQuestion = 0;
    triviaScore = 0;
    wrongTriviaAnswers = [];

    triviaQuestions =
        shuffleArray([...cokeTriviaQuestions]).slice(0, 5);

    showTriviaQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showTriviaQuestion() {

    const question = triviaQuestions[currentTriviaQuestion];

    document.getElementById("triviaQuestionNumber").textContent =
        `QUESTION ${currentTriviaQuestion + 1} OF 5`;

    document.getElementById("triviaScore").textContent =
        `SCORE: ${triviaScore}`;

    document.getElementById("triviaQuestion").textContent =
        question.question;

    const answersContainer =
        document.getElementById("triviaAnswers");

    answersContainer.innerHTML = "";

    document.getElementById("triviaFeedback").textContent = "";

    const shuffledAnswers =
        shuffleArray([...question.answers]);

    shuffledAnswers.forEach(answer => {

        const button = document.createElement("button");

        button.className = "triviaAnswer";

        button.textContent = answer;

        button.addEventListener("click", function() {

            answerTriviaQuestion(answer, button);

        });

        answersContainer.appendChild(button);

    });

}


/* =========================
   ANSWER QUESTION
========================= */

function answerTriviaQuestion(selectedAnswer, selectedButton) {

    const question = triviaQuestions[currentTriviaQuestion];

    const buttons =
        document.querySelectorAll(".triviaAnswer");

    buttons.forEach(button => {
        button.disabled = true;
    });


    if (selectedAnswer === question.correct) {

        triviaScore++;

        selectedButton.classList.add("correct");

        document.getElementById("triviaFeedback").textContent =
            "✓ CORRECT!";

    } else {

        selectedButton.classList.add("wrong");

        wrongTriviaAnswers.push({

            question: question.question,

            yourAnswer: selectedAnswer,

            correctAnswer: question.correct

        });

        document.getElementById("triviaFeedback").textContent =
            "✗ INCORRECT!";

    }


    document.getElementById("triviaScore").textContent =
        `SCORE: ${triviaScore}`;


    setTimeout(() => {

        currentTriviaQuestion++;

        if (currentTriviaQuestion >= 5) {

            showTriviaResults();

        } else {

            showTriviaQuestion();

        }

    }, 1000);

}


/* =========================
   RESULTS
========================= */

function showTriviaResults() {

    triviaScreen.style.display = "none";
    triviaResults.style.display = "flex";

    document.getElementById("finalScore").textContent =
        `${triviaScore} / 5`;

    const wrongContainer =
        document.getElementById("wrongAnswers");

    wrongContainer.innerHTML = "";


    if (wrongTriviaAnswers.length === 0) {

        wrongContainer.innerHTML = `
            <div class="wrongAnswerCard">
                🎉 PERFECT SCORE!<br><br>
                You got every question correct!
            </div>
        `;

    } else {

        wrongTriviaAnswers.forEach(item => {

            const card = document.createElement("div");

            card.className = "wrongAnswerCard";

            card.innerHTML = `
                <strong>Question:</strong><br>
                ${item.question}<br><br>

                <strong>Your answer:</strong><br>
                ${item.yourAnswer}<br><br>

                <strong>Correct answer:</strong><br>
                ${item.correctAnswer}
            `;

            wrongContainer.appendChild(card);

        });

    }

}


/* =========================
   BACK TO MENU
========================= */

document.getElementById("triviaBackButton").addEventListener("click", function() {

    triviaScreen.style.display = "none";
    mainMenu.style.display = "flex";

});


document.getElementById("resultsMenuButton").addEventListener("click", function() {

    triviaResults.style.display = "none";
    mainMenu.style.display = "flex";

});


/* =========================
   PLAY AGAIN
========================= */

document.getElementById("playTriviaAgain").addEventListener("click", function() {

    startTrivia();

});
    
</script>

    <div class="cokeOrNotContent">

        <img
            src="Coca-Cola_logo_white.png"
            alt="Coca-Cola"
            class="cokeOrNotLogo">

        <div class="cokeOrNotTop">

            <button id="cokeOrNotBackButton" class="backButton">
                ← MENU
            </button>

                PRODUCT 1 OF 5
            </div>

            <div id="cokeOrNotScore">
                SCORE: 0
            </div>

        </div>

        <div class="cokeOrNotTitle">
            COKE OR NOT?
        </div>

        <img

            class="cokeProductImage"
            src=""
            alt="Drink">

        <div class="cokeOrNotButtons">

            <button
                id="cokeButton"

                🥤 COKE
            </button>

            <button

        <div id="cokeOrNotFeedback"></div>

<!-- =========================
     COKE OR NOT RESULTS
========================= -->

<div id="cokeOrNotResults">

    <div class="cokeOrNotResultsContent">

        <img
            src="Coca-Cola_logo_white.png"
            alt="Coca-Cola"
            class="resultsLogo">

        <h1>COKE OR NOT COMPLETE!</h1>

        <div id="cokeOrNotFinalScore"></div>

        <div id="cokeOrNotWrongAnswers"></div>

        <div class="cokeOrNotResultButtons">

            <button id="cokeOrNotPlayAgain">
                PLAY AGAIN
            </button>

            <button id="cokeOrNotMenuButton">
                BACK TO MENU
            </button>

        </div>

    </div>

</div> 

<script>
/* =========================
   COKE OR NOT? PRODUCTS
========================= */

const cokeOrNotProducts = [

    /* =========================
       COKE PRODUCTS
    ========================= */

    {
        name: "Coca-Cola",
        image: "cocacola.jpg",
        isCoke: true
    },

    {
        name: "AHA",
        image: "AHA.jpg",
        isCoke: true
    },

    {
        name: "Barq's Root Beer",
        image: "Barqs.jpg",
        isCoke: true
    },

    {
        name: "Fanta",
        image: "fanta.jpg",
        isCoke: true
    },

    {
        name: "Powerade",
        image: "powerade.jpg",
        isCoke: true
    },

    {
        name: "Sprite",
        image: "sprite.jpg",
        isCoke: true
    },

    {
        name: "Minute Maid",
        image: "orange juice.jpg",
        isCoke: true
    },

    {
        name: "Dasani",
        image: "dasani.jpg",
        isCoke: true
    },


    /* =========================
       NOT COKE
    ========================= */

    {
        name: "7UP",
        image: "7up.jpg",
        isCoke: false
    },

    {
        name: "Bubly",
        image: "bubly.jpg",
        isCoke: false
    },

    {
        name: "Dr Pepper",
        image: "drpepper.jpg",
        isCoke: false
    },

    {
        name: "Gatorade",
        image: "gatorade.jpg",
        isCoke: false
    },

    {
        name: "Mountain Dew",
        image: "mountain-dew.jpg",
        isCoke: false
    },

    {
        name: "MUG Root Beer",
        image: "mug.jpg",
        isCoke: false
    },

    {
        name: "Pepsi",
        image: "pepsi.jpg",
        isCoke: false
    },

    {
        name: "Red Bull",
        image: "red_bull.jpg",
        isCoke: false
    }

];


/* =========================
   GAME VARIABLES
========================= */

let cokeOrNotQuestions = [];
let currentCokeOrNotQuestion = 0;
let cokeOrNotScore = 0;
let wrongCokeOrNotAnswers = [];


/* =========================
   START COKE OR NOT
========================= */

document.getElementById("cokeOrNotButton").addEventListener("click", startCokeOrNot);


function startCokeOrNot() {

    mainMenu.style.display = "none";
    cokeOrNotResults.style.display = "none";
    cokeOrNotScreen.style.display = "flex";

    currentCokeOrNotQuestion = 0;
    cokeOrNotScore = 0;
    wrongCokeOrNotAnswers = [];

    /* Pick 5 random products */

    cokeOrNotQuestions =
        shuffleArray([...cokeOrNotProducts]).slice(0, 5);

    showCokeOrNotQuestion();

}


/* =========================
   SHOW PRODUCT
========================= */

function showCokeOrNotQuestion() {

    const product =
        cokeOrNotQuestions[currentCokeOrNotQuestion];


    document.getElementById("cokeOrNotQuestionNumber").textContent =
        `PRODUCT ${currentCokeOrNotQuestion + 1} OF 5`;


    document.getElementById("cokeOrNotScore").textContent =
        `SCORE: ${cokeOrNotScore}`;


    document.getElementById("cokeProductImage").src =
        product.image;


    document.getElementById("cokeProductImage").alt =
        "Mystery drink";


    document.getElementById("cokeOrNotFeedback").textContent =
        "";


    /* Reset buttons */

    const cokeButton =
        document.getElementById("cokeButton");

    const notCokeButton =
        document.getElementById("notCokeButton");


    cokeButton.disabled = false;
    notCokeButton.disabled = false;

    cokeButton.classList.remove("correct", "wrong");
    notCokeButton.classList.remove("correct", "wrong");

}


/* =========================
   ANSWER
========================= */

function answerCokeOrNot(playerSaysCoke) {

    const product =
        cokeOrNotQuestions[currentCokeOrNotQuestion];


    const correct =
        playerSaysCoke === product.isCoke;


    const cokeButton =
        document.getElementById("cokeButton");

    const notCokeButton =
        document.getElementById("notCokeButton");


    /* Disable both buttons */

    cokeButton.disabled = true;
    notCokeButton.disabled = true;


    /* Correct answer */

    if (correct) {

        cokeOrNotScore++;


        if (playerSaysCoke) {

            cokeButton.classList.add("correct");

        } else {

            notCokeButton.classList.add("correct");

        }


        document.getElementById("cokeOrNotFeedback").textContent =
            "✓ CORRECT!";


    } else {

        if (playerSaysCoke) {

            cokeButton.classList.add("wrong");

        } else {

            notCokeButton.classList.add("wrong");

        }


        wrongCokeOrNotAnswers.push({

            product: product.name,

            yourAnswer:
                playerSaysCoke ? "COKE" : "NOT COKE",

            correctAnswer:
                product.isCoke ? "COKE" : "NOT COKE"

        });


        document.getElementById("cokeOrNotFeedback").textContent =
            "✗ INCORRECT!";

    }


    document.getElementById("cokeOrNotScore").textContent =
        `SCORE: ${cokeOrNotScore}`;


    /* Move to next product */

    setTimeout(() => {

        currentCokeOrNotQuestion++;


        if (currentCokeOrNotQuestion >= 5) {

            showCokeOrNotResults();

        } else {

            showCokeOrNotQuestion();

        }

    }, 1000);

}


/* =========================
   COKE BUTTON
========================= */

document.getElementById("cokeButton").addEventListener("click", function() {

    answerCokeOrNot(true);

});


/* =========================
   NOT COKE BUTTON
========================= */

document.getElementById("notCokeButton").addEventListener("click", function() {

    answerCokeOrNot(false);

});


/* =========================
   RESULTS
========================= */

function showCokeOrNotResults() {

    cokeOrNotScreen.style.display = "none";
    cokeOrNotResults.style.display = "flex";


    document.getElementById("cokeOrNotFinalScore").textContent =
        `${cokeOrNotScore} / 5`;


    const wrongContainer =
        document.getElementById("cokeOrNotWrongAnswers");


    wrongContainer.innerHTML = "";


    /* Perfect score */

    if (wrongCokeOrNotAnswers.length === 0) {

        wrongContainer.innerHTML = `
            <div class="cokeOrNotWrongCard">
                🎉 PERFECT SCORE!<br><br>
                You got every product correct!
            </div>
        `;

    } else {

        wrongCokeOrNotAnswers.forEach(item => {

            const card =
                document.createElement("div");


            card.className =
                "cokeOrNotWrongCard";


            card.innerHTML = `
                <strong>Product:</strong><br>
                ${item.product}<br><br>

                <strong>Your answer:</strong>
                ${item.yourAnswer}<br>

                <strong>Correct answer:</strong>
                ${item.correctAnswer}
            `;


            wrongContainer.appendChild(card);

        });

    }

}


/* =========================
   BACK TO MENU
========================= */

document.getElementById("cokeOrNotBackButton").addEventListener("click", function() {

    cokeOrNotScreen.style.display = "none";

    mainMenu.style.display = "flex";

});


document.getElementById("cokeOrNotMenuButton").addEventListener("click", function() {

    cokeOrNotResults.style.display = "none";

    mainMenu.style.display = "flex";

});


/* =========================
   PLAY AGAIN
========================= */

document.getElementById("cokeOrNotPlayAgain").addEventListener("click", function() {

    startCokeOrNot();

});

    
</script>
