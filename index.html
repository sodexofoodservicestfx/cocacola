<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background: #F40009;
    color: white;
}

/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.10) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08) 0 3px, transparent 4px),
        #F40009;
}

/* Decorative circles */

.bubble {
    position: absolute;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.12);
}

.bubble.one {
    width: 180px;
    height: 180px;
    top: -60px;
    left: -50px;
}

.bubble.two {
    width: 280px;
    height: 280px;
    right: -120px;
    bottom: -100px;
}

.bubble.three {
    width: 90px;
    height: 90px;
    right: 18%;
    top: 12%;
}

/* Main content */

.welcomeContent {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 1000px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Coca-Cola logo */

.cocaLogo {
    width: min(750px, 80vw);
    height: auto;

    display: block;

    margin-bottom: 30px;
}

/* Divider */

.logoLine {
    width: 240px;
    height: 5px;

    background: white;

    border-radius: 10px;

    margin-bottom: 35px;
}

/* Welcome text */

.welcomeText {
    font-size: clamp(28px, 4vw, 55px);
    font-weight: bold;

    letter-spacing: 4px;

    margin-bottom: 45px;
}

/* Start button */

#startButton {
    width: min(520px, 80vw);
    height: 120px;

    border: 5px solid white;
    border-radius: 30px;

    background: white;
    color: #F40009;

    font-size: clamp(32px, 4vw, 52px);
    font-weight: 900;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 10px 0 rgba(0,0,0,0.15);

    transition:
        transform 0.1s,
        box-shadow 0.1s;
}

#startButton:active {
    transform: translateY(8px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}

/* Small bottom text */

.bottomText {
    margin-top: 40px;

    font-size: 22px;
    font-weight: bold;

    opacity: 0.8;

    letter-spacing: 2px;
}

/* =========================
   MAIN MENU
========================= */

#mainMenu {
    width: 100%;
    height: 100%;

    display: none;

    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background: #F40009;
}

.menuContent {
    width: 90%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

.menuLogo {
    width: min(430px, 55vw);
    height: auto;

    margin-bottom: 15px;

     transform: translateY(-100px);
}

.menuTitle {
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 900;

    letter-spacing: 3px;

    margin-bottom: 30px;
}

.menuButtons {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 20px;
}

.menuButton {
    min-height: 150px;

    border: 5px solid white;
    border-radius: 25px;

    background: white;
    color: #F40009;

    font-size: clamp(25px, 3vw, 40px);
    font-weight: 900;

    cursor: pointer;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 12px;

    box-shadow:
        0 8px 0 rgba(0,0,0,0.15);

    transition:
        transform 0.1s,
        box-shadow 0.1s;
}

.menuButton:active {
    transform: translateY(7px);

    box-shadow:
        0 2px 0 rgba(0,0,0,0.15);
}

.menuButton span {
    display: block;
}


/* =========================
   T972 / SMALLER SCREENS
========================= */

@media (max-width: 800px) {

    .menuButtons {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .menuButton {
        min-height: 110px;
    }

}

/* =========================
   COKE TRIVIA
========================= */

#triviaScreen,
#triviaResults {
    width: 100%;
    height: 100%;

    display: none;

    align-items: center;
    justify-content: center;

    background: #F40009;

    color: white;

    overflow: hidden;
}

.triviaContent {
    width: 92%;
    max-width: 1100px;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.triviaLogo {
    width: min(300px, 35vw);
    height: auto;

    margin-bottom: 20px;
}

.triviaTop {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.backButton {
    border: 3px solid white;
    border-radius: 15px;

    background: transparent;
    color: white;

    padding: 15px 25px;

    font-size: 22px;
    font-weight: bold;
}

#triviaQuestionNumber,
#triviaScore {
    font-size: 24px;
    font-weight: 900;
}

.triviaQuestion {
    width: 100%;

    min-height: 160px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: white;
    color: #F40009;

    border-radius: 25px;

    padding: 30px;

    font-size: clamp(30px, 4vw, 50px);
    font-weight: 900;

    margin-bottom: 25px;
}

.triviaAnswers {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.triviaAnswer {
    min-height: 100px;

    border: 4px solid white;
    border-radius: 20px;

    background: white;
    color: #F40009;

    font-size: clamp(24px, 3vw, 36px);
    font-weight: 900;

    padding: 20px;

    cursor: pointer;

    box-shadow: 0 7px 0 rgba(0,0,0,0.15);
}

.triviaAnswer:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}

.triviaAnswer.correct {
    background: #2e9b4b;
    color: white;
}

.triviaAnswer.wrong {
    background: #222;
    color: white;
}

#triviaFeedback {
    min-height: 50px;

    margin-top: 15px;

    font-size: 28px;
    font-weight: 900;

    text-align: center;
}


/* =========================
   TRIVIA RESULTS
========================= */

.resultsContent {
    width: 90%;
    max-width: 900px;

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow: hidden;
}

.resultsLogo {
    width: min(280px, 30vw);

    margin-bottom: 15px;
}

.resultsContent h1 {
    font-size: clamp(30px, 4vw, 50px);

    margin-bottom: 10px;
}

#finalScore {
    font-size: clamp(55px, 7vw, 90px);

    font-weight: 900;

    margin-bottom: 20px;
}


/* YOU MISSED */

.triviaMissedTitle {
    font-size: clamp(24px, 3vw, 34px);

    font-weight: 900;

    margin-bottom: 15px;
}


/* Wrong answers */

#wrongAnswers {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 10px;

    margin-bottom: 25px;
}

.wrongAnswerCard {
    width: 100%;

    background: white;
    color: #222;

    border-radius: 15px;

    padding: 15px 20px;

    font-size: clamp(20px, 2.5vw, 28px);

    font-weight: bold;

    text-align: center;
}

.wrongAnswerCard .wrongIcon {
    color: #F40009;

    margin-right: 8px;
}

.wrongAnswerCard .correctAnswer {
    color: #2e9b4b;

    font-weight: 900;
}


/* Result buttons */

.resultButtons {
    display: flex;

    gap: 15px;

    justify-content: center;

    flex-wrap: wrap;
}

.resultButtons button {
    min-width: 240px;
    min-height: 75px;

    border: 4px solid white;
    border-radius: 20px;

    background: white;
    color: #F40009;

    font-size: 24px;
    font-weight: 900;

    padding: 12px 20px;

    cursor: pointer;

    box-shadow: 0 7px 0 rgba(0,0,0,0.15);
}

.resultButtons button:active {
    transform: translateY(6px);

    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
}


/* =========================
   SMALLER SCREENS
========================= */

@media (max-width: 800px) {

    .resultsContent {
        width: 92%;
    }

    .wrongAnswerCard {
        padding: 12px 15px;
    }

    .resultButtons {
        width: 100%;

        flex-direction: column;
    }

    .resultButtons button {
        width: 100%;
    }

}
/* =========================
   SMALLER SCREENS
========================= */

@media (max-width: 800px) {

    .triviaAnswers {
        grid-template-columns: 1fr;
    }

    .triviaAnswer {
        min-height: 80px;
    }

    .triviaQuestion {
        min-height: 130px;
    }

}

function shuffleArray(array) {

    return array.sort(() => Math.random() - 0.5);

}


/* =========================

========================= */

document.getElementById("triviaButton").addEventListener("click", startTrivia);


function startTrivia() {

    mainMenu.style.display = "none";

    triviaQuestions =

    showTriviaQuestion();

}

========================= */

function showTriviaQuestion() {

    const question = triviaQuestions[currentTriviaQuestion];

    const answersContainer =
        document.getElementById("triviaAnswers");

    answersContainer.innerHTML = "";

    document.getElementById("triviaFeedback").textContent = "";

    const shuffledAnswers =
        shuffleArray([...question.answers]);

    shuffledAnswers.forEach(answer => {

        const button = document.createElement("button");

        button.className = "triviaAnswer";

        button.textContent = answer;

        button.addEventListener("click", function() {

            answerTriviaQuestion(answer, button);

        });

        answersContainer.appendChild(button);

    });

}


/* =========================
   ANSWER QUESTION
========================= */

function answerTriviaQuestion(selectedAnswer, selectedButton) {

    const question = triviaQuestions[currentTriviaQuestion];

    const buttons =
        document.querySelectorAll(".triviaAnswer");

    buttons.forEach(button => {
        button.disabled = true;
    });


    if (selectedAnswer === question.correct) {

        triviaScore++;

        selectedButton.classList.add("correct");

        document.getElementById("triviaFeedback").textContent =
            "✓ CORRECT!";

    } else {

        selectedButton.classList.add("wrong");

        wrongTriviaAnswers.push({

            question: question.question,

            yourAnswer: selectedAnswer,

            correctAnswer: question.correct

        });

        document.getElementById("triviaFeedback").textContent =
            "✗ INCORRECT!";

    }


    document.getElementById("triviaScore").textContent =
        `SCORE: ${triviaScore}`;


    setTimeout(() => {

        currentTriviaQuestion++;

        if (currentTriviaQuestion >= 5) {

            showTriviaResults();

        } else {

            showTriviaQuestion();

        }

    }, 1000);

}

========================= */

/* =========================
   NORMALIZE ANSWER
========================= */

function normalizeGuess(answer) {

    return answer
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "");

}


/* =========================
   SUBMIT GUESS
========================= */

function submitGuessProduct() {

    const product =
        guessProductQuestions[currentGuessProductQuestion];

    const input =
        document.getElementById("guessProductInput");

    const playerGuess =
        input.value.trim();

    if (playerGuess === "") {
        return;
    }

    currentGuessCount++;



    document.getElementById(
        "guessCount"
    ).textContent =
        `GUESSES: ${currentGuessCount}`;


  const playerAnswer =
        normalizeGuess(playerGuess);

    const isCorrect =
        product.acceptedAnswers.some(answer =>
            normalizeGuess(answer) === playerAnswer
        );


    /* =========================
       CORRECT
    ========================= */

    if (isCorrect) {

        let points;


        if (currentGuessCount === 1) {

            points = 5;

        } else if (currentGuessCount === 2) {

            points = 4;

        } else if (currentGuessCount === 3) {

            points = 3;

        } else if (currentGuessCount === 4) {

            points = 2;

        } else {

            points = 1;

        }


        guessProductScore += points;


        document.getElementById(
            "guessProductScore"
        ).textContent =
            `SCORE: ${guessProductScore}`;


     document.getElementById(
    "guessProductImage"
).style.filter =
    "blur(0px)";


        document.getElementById(
            "guessProductFeedback"
        ).textContent =
            `✓ CORRECT! +${points}`;


        input.disabled = true;


        document.getElementById(
            "guessProductSubmit"
        ).disabled = true;


        setTimeout(() => {

            currentGuessProductQuestion++;


            if (
                currentGuessProductQuestion >= 5
            ) {

                showGuessProductResults();

            } else {

                showGuessProductQuestion();

            }

        }, 1500);


        return;

    }


    /* =========================
       WRONG GUESS
    ========================= */

    document.getElementById(
        "guessProductFeedback"
    ).textContent =
        "✗ INCORRECT!";


   
  const blurLevels = [
    16,
    10,
    6,
    3,
    1
];

const blurIndex =
    Math.min(
        currentGuessCount,
        blurLevels.length - 1
    );

document.getElementById(
    "guessProductImage"
).style.filter =
    `blur(${blurLevels[blurIndex]}px)`;

    input.value = "";

    input.focus();

}

function shuffleWorldArray(array) {

}

    const question =

        .textContent = "";

    .textContent =
    question.question;

    document
        .getElementById("worldImage")
        .src =
        question.image;


    document
        .getElementById("worldImage")
        .alt =
        question.name;


    const answersContainer =
        document.getElementById("worldAnswers");


    answersContainer.innerHTML = "";


    /* Randomize answer positions */

    const shuffledAnswers =
        shuffleWorldArray([...question.answers]);


    shuffledAnswers.forEach(answer => {

        const button =
            document.createElement("button");


        button.className =
            "worldAnswer";


        button.textContent =
            answer;


        button.addEventListener(
            "click",
            function() {

                answerWorldQuestion(
                    answer,
                    button
                );

            }
        );


        answersContainer.appendChild(button);

    });

}


/* =========================
   ANSWER QUESTION
========================= */

function answerWorldQuestion(
    selectedAnswer,
    selectedButton
) {

    const question =
        worldQuestions[currentWorldQuestion];

    const buttons =
        document.querySelectorAll(".worldAnswer");


    /* Disable all buttons */

    buttons.forEach(button => {

        button.disabled = true;

    });


    /* =========================
       CORRECT
    ========================= */

    if (selectedAnswer === question.correct) {

        worldScore++;

        selectedButton.classList.add("correct");

        document
            .getElementById("worldFeedback")
            .textContent =
            "✓ CORRECT!";

    }


    /* =========================
       WRONG
    ========================= */

    else {

        selectedButton.classList.add("wrong");


        /* Show correct answer */

        buttons.forEach(button => {

            if (button.textContent === question.correct) {

                button.classList.add("correct");

            }

        });


        /* Save wrong answer */

        wrongWorldAnswers.push({

            question: question.question,

            yourAnswer: selectedAnswer,

            correctAnswer: question.correct

        });


        document
            .getElementById("worldFeedback")
            .textContent =
            "✗ INCORRECT!";

    }


    document
        .getElementById("worldScore")
        .textContent =
        `SCORE: ${worldScore}`;


    /* =========================
       NEXT QUESTION
    ========================= */

    setTimeout(() => {

        currentWorldQuestion++;


        if (currentWorldQuestion >= 5) {

            showWorldResults();

        }

        else {

            showWorldQuestion();

        }

    }, 1200);

}
